<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProGallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin: 20px 0 40px;
      font-size: 2.5rem;
      background: linear-gradient(90deg, #ff3d00, #ff9100);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
   .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
   .card {
      background: #1a1a1a;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s ease;
      border: 1px solid #2a2a2a;
    }
   .card:hover { transform: translateY(-8px); }
   .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }
   .card-info {
      padding: 16px;
    }
   .card-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
   .card-tool {
      color: #ff9100;
      font-size: 0.9rem;
      opacity: 0.8;
    }
   .loading {
      text-align: center;
      font-size: 1.2rem;
      padding: 60px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <h1>ProGallery</h1>
  <div id="gallery" class="gallery">
    <div class="loading">Вчитување...</div>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0D7Hlt10WBXWMq3rrlWnBd5ep3NiKlPsjQ8b-LTVB0XDrNrmg42ifgT0hl-7n8B2MM-hm_obF3vRB/pub?output=csv';

    async function loadGallery() {
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const rows = text.split('\n').slice(1); // skip header
        
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';
        
        rows.forEach(row => {
          const cols = row.split(',');
          if (cols.length < 3) return;
          
          const name = cols[0].trim();
          const image = cols[2].trim();
          const tool = cols[3]? cols[3].trim() : '';
          
          if (!image) return;
          
          const card = `
            <div class="card">
              <img src="${image}" alt="${name}" loading="lazy">
              <div class="card-info">
                <div class="card-name">${name}</div>
                <div class="card-tool">${tool}</div>
              </div>
            </div>
          `;
          gallery.innerHTML += card;
        });
        
        if (gallery.innerHTML === '') {
          gallery.innerHTML = '<div class="loading">Нема слики во галеријата.</div>';
        }
      } catch (e) {
        document.getElementById('gallery').innerHTML = '<div class="loading">Грешка при вчитување.</div>';
      }
    }
    
    loadGallery();
  </script>
</body>
</html>
