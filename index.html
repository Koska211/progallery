<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProGallery AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .upload-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        #uploadBtn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        #uploadBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #fileInput { display: none; }
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .status.success { background: #d4edda; color: #155724; display: block; }
        .status.error { background: #f8d7da; color: #721c24; display: block; }
        .status.loading { background: #d1ecf1; color: #0c5460; display: block; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .image-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        .image-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .image-info {
            padding: 10px;
            font-size: 12px;
            color: #666;
        }
        .stats {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 ProGallery AI</h1>
            <p>Неограничено качување слики со ImgBB Cloud</p>
        </div>

        <div class="upload-section">
            <input type="file" id="fileInput" accept="image/*" multiple>
            <button id="uploadBtn">📤 Прикачи Слики</button>
            <div id="status" class="status"></div>
        </div>

        <div class="stats" id="stats">Вкупно слики: 0</div>
        <div class="gallery" id="gallery"></div>
    </div>

    <script>
        const IMGBB_API_KEY = 'ae8fa9ea565927708b803b28c74b635e';
        const STORAGE_KEY = 'progallery_imgbb_urls';
        
        let images = [];
        
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const gallery = document.getElementById('gallery');
        const stats = document.getElementById('stats');

        // Вчитај слики од localStorage
        function loadImages() {
            const saved = localStorage.getItem(STORAGE_KEY);
            images = saved ? JSON.parse(saved) : [];
            renderGallery();
        }

        // Зачувај слики во localStorage
        function saveImages() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(images));
            updateStats();
        }

        // Прикажи галерија
        function renderGallery() {
            gallery.innerHTML = '';
            images.forEach((img, index) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <img src="${img.url}" alt="${img.name}" loading="lazy">
                    <button class="delete-btn" onclick="deleteImage(${index})">🗑️</button>
                    <div class="image-info">${img.name}</div>
                `;
                gallery.appendChild(card);
            });
            updateStats();
        }

        // Избриши слика
        window.deleteImage = function(index) {
            if (confirm('Да се избрише сликата?')) {
                images.splice(index, 1);
                saveImages();
                renderGallery();
                showStatus('Сликата е избришана!', 'success');
            }
        }

        // Ажурирај статистика
        function updateStats() {
            stats.textContent = `Вкупно слики: ${images.length} | ImgBB Cloud ☁️`;
        }

        // Покажи статус
        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        // Качи на ImgBB
        async function uploadToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);
            
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            if (data.success) {
                return {
                    url: data.data.url,
                    name: file.name,
                    size: file.size,
                    uploaded: new Date().toISOString()
                };
            } else {
                throw new Error('Upload failed');
            }
        }

        // Upload копче
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // Кога ќе се изберат фајлови
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            uploadBtn.disabled = true;
            showStatus(`Се качуваат ${files.length} слики...`, 'loading');

            let uploaded = 0;
            let failed = 0;

            for (const file of files) {
                try {
                    const imgData = await uploadToImgBB(file);
                    images.unshift(imgData);
                    uploaded++;
                    showStatus(`Качено ${uploaded}/${files.length}...`, 'loading');
                } catch (error) {
                    failed++;
                    console.error('Error:', error);
                }
            }

            saveImages();
            renderGallery();
            uploadBtn.disabled = false;
            fileInput.value = '';

            if (failed === 0) {
                showStatus(`✅ Успешно качени ${uploaded} слики!`, 'success');
            } else {
                showStatus(`⚠️ Качени ${uploaded}, неуспешни ${failed}`, 'error');
            }
        });

        // Старт
        loadImages();
    </script>
</body>
</html>
